services:
  backend:
    build: ./backend
    container_name: bridge-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - BRIDGE_DB_URL=sqlite+aiosqlite:///data/bridge.db
      - BRIDGE_CHROMA_PATH=chroma
      - BRIDGE_LOG_FILE=logs/bridge.log
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - backend-chroma:/app/chroma
      - ./knowledge:/app/knowledge:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bridge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  backend-logs:
  backend-chroma:
