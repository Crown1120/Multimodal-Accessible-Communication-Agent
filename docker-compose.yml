services:
  backend:
    build: ./backend
    container_name: bridge-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - BRIDGE_DB_URL=sqlite+aiosqlite:///data/bridge.db
      - BRIDGE_CHROMA_PATH=chroma
      - BRIDGE_LOG_FILE=logs/bridge.log
      - ENVIRONMENT=production
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      - backend-chroma:/app/chroma
      - ./knowledge:/app/knowledge:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: bridge-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
  backend-logs:
  backend-chroma:
